# / -> front (web), /api -> API direto (evita um hop nginx->api desnecessário
# quando o Ingress já resolve o roteamento; o nginx continua com o proxy /api
# parametrizado por API_UPSTREAM para funcionar também fora do cluster).
{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mural.fullname" . }}
  labels:
    {{- include "mural.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "mural.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "mural.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
