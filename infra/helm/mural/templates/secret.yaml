# Única fonte da senha do Postgres/DATABASE_URL. Nenhum outro manifest do chart
# contém a credencial em texto plano — todos injetam via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.fullname" . }}-db
  labels:
    {{- include "mural.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.user | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRES_DB: {{ .Values.postgres.database | quote }}
  DATABASE_URL: {{ include "mural.databaseURL" . | quote }}
